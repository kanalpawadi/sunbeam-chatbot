name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]
  pull_request:
    paths-ignore: ["data/**", "**.md"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import backend.main, pipeline.scrape, pipeline.ingest; print('ok')"
      - name: Scraper smoke test (no embeddings, nothing committed)
        run: python -m pipeline.scrape
