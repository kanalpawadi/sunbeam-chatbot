name: Refresh Sunbeam knowledge base

# Scrapes the live Sunbeam website every day, re-embeds changed text with Gemini and
# commits the updated knowledge files. The backend picks up the new files automatically.
on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-knowledge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scrape sunbeaminfo.in and sunbeaminfo.com
        run: python -m pipeline.scrape

      - name: Embed changed chunks with Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m pipeline.ingest

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Website data unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh Sunbeam knowledge base ($(date -u +%Y-%m-%d))"
          git push

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          k = pathlib.Path("data/knowledge.json")
          c = pathlib.Path("data/catalog.json")
          if k.exists():
              d = json.loads(k.read_text(encoding="utf-8"))
              print(f"### Knowledge base\n- Updated: {d['updated_at']}\n- Documents: {d['document_count']}\n- Chunks: {len(d['chunks'])}")
          if c.exists():
              print(f"- Courses: {len(json.loads(c.read_text(encoding='utf-8')))}")
          EOF
